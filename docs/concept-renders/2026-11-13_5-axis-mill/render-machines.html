<body>
<div class="og-copy">
  <img src="../assets/img/refaqt-logo.png" alt="">
  <h1>Industrial machines,<br><span>open to everyone.</span></h1>
  <p>Open-source motion modules and machines for local, on-demand manufacturing.</p>
</div>
<div id="v"></div>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { loadTemplate, Stage } from '../aqtuator/assets/js/viewer.js';

const og = location.hash === '#og';
document.body.classList.toggle('og', og);
const el = document.getElementById('v');

// Stage facts (metres): carriage-top centre in model coordinates.
const CAR = new THREE.Vector3(0.2096, 0.060, -0.105);

// ---------- materials ----------
const phys = (o) => new THREE.MeshPhysicalMaterial(o);
const MAT = {
  frame: phys({ color: 0xaab0b5, metalness: 1.0, roughness: 0.34 }),          // clear anodised aluminium
  base: phys({ color: 0x45484c, metalness: 0.0, roughness: 0.85 }),           // mineral cast base
  granite: phys({ color: 0x5b5e62, metalness: 0.0, roughness: 0.6, clearcoat: 0.3, clearcoatRoughness: 0.5 }),
  body: phys({ color: 0xe6e8ea, metalness: 0.1, roughness: 0.35, clearcoat: 0.5 }), // spindle and head housings
  shell: phys({ color: 0x8e9296, metalness: 0.0, roughness: 0.55 }),                // lathe monoblock
  dark: phys({ color: 0x16181a, metalness: 0.5, roughness: 0.45 }),
  steel: phys({ color: 0xc4c8cc, metalness: 1.0, roughness: 0.2 }),
  accent: phys({ color: 0x00ac99, metalness: 0.3, roughness: 0.35 }),
  copper: phys({ color: 0xc8743c, metalness: 1.0, roughness: 0.3 }),
  led: new THREE.MeshStandardMaterial({ color: 0x00e0a0, emissive: 0x00e0a0, emissiveIntensity: 2.5 }),
  black: phys({ color: 0x141618, metalness: 0.6, roughness: 0.4, clearcoat: 0.35, clearcoatRoughness: 0.4 }), // black anodised aluminium
  tube: phys({ color: 0x141618, metalness: 0.3, roughness: 0.5, clearcoat: 0.3, clearcoatRoughness: 0.5 }),   // black powder-coated steel tube
  cover: phys({ color: 0x1d1f22, metalness: 0.2, roughness: 0.5 }),                                              // black sheet-metal cover plate
  ruby: phys({ color: 0xd0103a, metalness: 0.0, roughness: 0.1, clearcoat: 1 }),
};

function mesh(geo, mat) { const m = new THREE.Mesh(geo, mat); m.castShadow = true; m.receiveShadow = true; return m; }
function box(p, w, h, d, mat, x = 0, y = 0, z = 0) {
  const m = mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); p.add(m); return m;
}
// Cylinder along an axis ('x', 'y' or 'z').
function cyl(p, r, len, mat, axis = 'y', x = 0, y = 0, z = 0, r2 = r, seg = 48) {
  const m = mesh(new THREE.CylinderGeometry(r2, r, len, seg), mat);
  if (axis === 'x') m.rotation.z = -Math.PI / 2;
  if (axis === 'z') m.rotation.x = Math.PI / 2;
  m.position.set(x, y, z); p.add(m); return m;
}
// Triangular rib behind a vertical plate. It points to -Z, with thickness along X.
function rib(p, depth, height, t, mat, x, y, z) {
  const s = new THREE.Shape([new THREE.Vector2(0, 0), new THREE.Vector2(depth, 0), new THREE.Vector2(0, height)]);
  const m = mesh(new THREE.ExtrudeGeometry(s, { depth: t, bevelEnabled: false }), mat);
  m.rotation.y = Math.PI / 2; m.position.set(x - t / 2, y, z); p.add(m); return m;
}

let parts;
// The model is the CS-220 (440 mm long). For a longer stage, the fixed parts (base, rails,
// magnet track, seal strip) are stretched at the middle. The carriage keeps its size.
const stretched = new Map();
function stretch(geo, len) {
  const key = geo.uuid + ':' + len;
  if (!stretched.has(key)) {
    const g = geo.clone(), pos = g.attributes.position, d = (len - 0.44) / 2;
    for (let i = 0; i < pos.count; i++) pos.setX(i, pos.getX(i) + (pos.getX(i) > 0.22 ? d : -d));
    g.computeBoundingBox(); g.computeBoundingSphere();
    stretched.set(key, g);
  }
  return stretched.get(key);
}
// A stage. 'travel', 'up' and 'across' are world directions of the stage axes.
// The root is the centre of the base bottom. 'len' is the stage length in metres.
function stage(p, pos, offset = 0, travel = [1, 0, 0], up = [0, 1, 0], len = 0.44) {
  const s = new Stage(parts);
  if (len !== 0.44) for (const m of s.meshes) if (m.userData.parent === s.model) m.geometry = stretch(m.geometry, len);
  const tx = new THREE.Vector3(...travel), ny = new THREE.Vector3(...up), cz = new THREE.Vector3().crossVectors(tx, ny);
  s.root.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(tx, ny, cz));
  s.root.position.set(...pos);
  s.setOffset(offset);
  p.add(s.root);
  stages.push(s);
  return s;
}
// A group on the carriage top centre. With world = true its axes follow the world.
function onCarriage(s, world = false) {
  const g = new THREE.Group(); g.position.copy(CAR); s.carriage.add(g);
  if (!world) return g;
  // Undo the full turn of the carriage, also for a stage stacked on another stage.
  g.updateWorldMatrix(true, false);
  const w = new THREE.Group(); g.getWorldQuaternion(w.quaternion); w.quaternion.invert(); g.add(w); return w;
}
// Second stage turned 90 degrees on a carriage, as in the AQTUATOR XY table.
function crossStage(s, offset) {
  const g = onCarriage(s);
  const b = new Stage(parts);
  b.root.rotation.y = Math.PI / 2;
  b.root.position.set(0, 0, 0.04);
  b.setOffset(offset);
  g.add(b.root);
  stages.push(b);
  return b;
}
const stages = [];

// Levelling foot: threaded rod, nut and a round pad.
function foot(p, x, z, h) {
  cyl(p, 0.03, 0.012, MAT.dark, 'y', x, 0.006, z, 0.026);
  cyl(p, 0.008, h - 0.012, MAT.steel, 'y', x, 0.012 + (h - 0.012) / 2, z);
  cyl(p, 0.014, 0.01, MAT.steel, 'y', x, h - 0.012, z, 0.014, 6);
}
// Ring of bolt heads on a face that points along +x or -x.
function boltRing(p, n, r, x, y, z, dir = 1) {
  for (let i = 0; i < n; i++) {
    const a = (i + 0.5) * 2 * Math.PI / n;
    cyl(p, 0.0045, 0.004, MAT.dark, 'x', x + dir * 0.002, y + Math.cos(a) * r, z + Math.sin(a) * r, 0.0045, 16);
  }
}
// Flat plate in the XZ plane from a 2D outline (x, z), with optional holes. Top at y.
function plate(p, outline, holes, t, mat, y) {
  const v = (pts) => pts.map(([x, z]) => new THREE.Vector2(x, -z));
  const s = new THREE.Shape(v(outline));
  for (const h of holes) s.holes.push(new THREE.Path(v(h)));
  const m = mesh(new THREE.ExtrudeGeometry(s, { depth: t, bevelEnabled: false }), mat);
  m.rotation.x = -Math.PI / 2; m.position.y = y - t; p.add(m); return m;
}
// Rectangle with cut corners, as a list of 2D points.
function cutRect(cx, cz, hx, hz, c) {
  return [[cx - hx + c, cz - hz], [cx + hx - c, cz - hz], [cx + hx, cz - hz + c], [cx + hx, cz + hz - c],
    [cx + hx - c, cz + hz], [cx - hx + c, cz + hz], [cx - hx, cz + hz - c], [cx - hx, cz - hz + c]];
}

// ---------- the four machines (base top at y = 0) ----------
function mill() {
  // 5-axis milling machine on a stand (founder sketches, 13-11-2026). Units: metres. Front is +z.
  // Machine body: 560 x 760, walls of 80 mm profile between two 10 mm plates (100 mm), all
  // black anodised. Gantry: two CS-520 Y stages on their edge on the side walls, a 160 mm beam
  // between the Y carriages with a CS-220 X stage on its front, and a CS-220 Z stage in a column.
  // Cradle (A axis) at the front, in the cutout of the front wall.
  // Width: wall 100 | cradle side 20 | 10 | spindle 80 | X travel 220 | 10 | cradle side 20 | wall 100.
  // Heights: bottom 180 | 10 | cradle bottom 100 (C table flush in it) | cradle | 10 | Y stages.
  const m = new THREE.Group(); m.userData.floor = true;
  const CT = 0.8, FT = 0.045, T = 0.05;            // stand top, foot height, frame tube size
  const MB = CT + 0.02;                            // machine bottom, on the rubber mounts
  const h = (v) => MB + v;                         // height above the machine bottom
  const WT = h(0.5), Yc = WT + 0.105;             // wall top, Y stage centre height
  const A = h(0.385), ZA = 0.255;                  // A axis: 20 mm + 105 mm from the front
  const Zc = 1.66;                                 // Z stage centre height
  const offY = 0.0254, offX = 0.03, offZ = -0.0456;
  const zY = -0.0104 + offY;                       // Y carriage centre (z)
  const xX = -0.0104 + offX;                       // X carriage centre (x)
  const cc = Zc - 0.0104 + offZ;                   // Z carriage centre (y)
  const K = MAT.black;

  // Stand: a frame of 50 mm steel tubes, 600 x 800, with cover plates set in between.
  const hx = 0.3 - T / 2, hz = 0.4 - T / 2, H = CT - FT;
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    foot(m, sx * hx, sz * hz, FT);
    box(m, T, H, T, MAT.tube, sx * hx, FT + H / 2, sz * hz);
  }
  for (const y of [FT + T / 2, CT - T / 2]) {
    for (const sz of [-1, 1]) box(m, 0.6 - 2 * T, T, T, MAT.tube, 0, y, sz * hz);
    for (const sx of [-1, 1]) box(m, T, T, 0.8 - 2 * T, MAT.tube, sx * hx, y, 0);
  }
  const ph = H - 2 * T, py = (FT + CT) / 2;
  for (const sx of [-1, 1]) box(m, 0.004, ph, 0.8 - 2 * T, MAT.cover, sx * (0.3 - 0.012), py, 0);
  box(m, 0.6 - 2 * T, ph, 0.004, MAT.cover, 0, py, -(0.4 - 0.012));
  // Front door with a handle on the left and two hinges on the right.
  box(m, 0.6 - 2 * T - 0.006, ph - 0.006, 0.004, MAT.cover, 0, py, 0.4 - 0.008);
  box(m, 0.012, 0.14, 0.012, MAT.steel, -0.2, py, 0.4 + 0.012);
  for (const s of [-1, 1]) {
    box(m, 0.012, 0.012, 0.012, MAT.steel, -0.2, py + s * 0.06, 0.4 + 0.002);
    cyl(m, 0.007, 0.05, MAT.steel, 'y', 0.247, py + s * 0.22, 0.4);
  }
  for (let i = 0; i < 6; i++) box(m, 0.004, 0.012, 0.16, MAT.dark, 0.3 - 0.008, 0.22 + i * 0.025, -0.15);
  // Chip bin inside the stand, under the chip hole.
  box(m, 0.44, 0.16, 0.4, MAT.shell, 0, CT - 0.2, 0.15);
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) cyl(m, 0.025, 0.02, MAT.dark, 'y', sx * 0.25, CT + 0.01, sz * 0.35);

  // Machine body. Side walls and back wall up to 500 mm, a 10 mm front plate (see below).
  for (const sx of [-1, 1]) {
    box(m, 0.1, 0.5, 0.75, K, sx * 0.23, h(0.25), -0.005);
    for (const x of [0.19, 0.27]) box(m, 0.002, 0.001, 0.76, MAT.dark, sx * x, WT + 0.0005, 0);   // plate seams
  }
  box(m, 0.36, 0.5, 0.1, K, 0, h(0.25), -0.33);
  for (const z of [-0.29, -0.37]) box(m, 0.36, 0.001, 0.002, MAT.dark, 0, WT + 0.0005, z);
  // Bottom part: 180 mm. Behind the cradle it is solid. Under the cradle is a large pocket:
  // four slopes of 10 mm plate lead the chips down to a hole into the chip bin in the stand.
  const hb = 0.18, P0 = 0.0, P1 = 0.37;            // pocket from z = P0 to the front plate
  box(m, 0.36, hb, P0 + 0.38, K, 0, h(hb / 2), (P0 - 0.38) / 2);
  const KD = K.clone(); KD.side = THREE.DoubleSide;
  const T0 = [[-0.18, P0], [0.18, P0], [0.18, P1], [-0.18, P1]];    // pocket edge at the top
  const B0 = [[-0.06, 0.13], [0.06, 0.13], [0.06, 0.25], [-0.06, 0.25]]; // hole at the bottom
  for (let i = 0; i < 4; i++) {
    const j = (i + 1) % 4, v = [];
    for (const [x, z, y] of [[...T0[i], hb], [...T0[j], hb], [...B0[j], 0], [...T0[i], hb], [...B0[j], 0], [...B0[i], 0]]) v.push(x, h(y), z);
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(v, 3)); g.computeVertexNormals();
    m.add(mesh(g, KD));
  }
  // Front plate, 10 mm: the opposite shape of the cradle, with 10 mm space. The cradle moves
  // through it, and the plate fills the corners.
  const fp = new THREE.Shape([[-0.28, 0], [0.28, 0], [0.28, 0.5], [0.188, 0.5], [0.188, 0.2659], [0.1021, 0.18],
    [-0.1021, 0.18], [-0.188, 0.2659], [-0.188, 0.5], [-0.28, 0.5]].map(([x, y]) => new THREE.Vector2(x, y)));
  const fm = mesh(new THREE.ExtrudeGeometry(fp, { depth: 0.01, bevelEnabled: false }), K);
  fm.position.set(0, MB, 0.37); m.add(fm);

  // Green LED strip on the inside of the back plate, right under the Y axis.
  box(m, 0.36, 0.012, 0.004, MAT.led, 0, WT - 0.012, -0.278);
  for (const x of [-0.12, 0, 0.12]) {
    const led = new THREE.PointLight(0x00e0a0, 0.12, 0.7, 2); led.position.set(x, WT - 0.03, -0.26); m.add(led);
  }

  // Y stages on their edge on the side walls, flush with the outside. Carriages face inward.
  for (const sx of [-1, 1]) stage(m, [sx * 0.28, Yc, 0], offY, [0, 0, 1], [-sx, 0, 0], 0.74);
  // Gantry: a 160 mm beam between the Y carriages, the X stage bolted on its front.
  // The front of the X stage is flush with the front of the Y carriages.
  const zb = zY + 0.045;
  box(m, 0.44, 0.21, 0.16, K, 0, Yc, zb - 0.08);
  stage(m, [0, Yc, zb], offX, [1, 0, 0], [0, 0, 1]);

  // Z stage on the X carriage, inside a closed column.
  const z0 = zb + 0.06, z1 = z0 + 0.22, yB = Zc - 0.225, yT = Zc + 0.235;
  stage(m, [xX, Zc, z0], offZ, [0, 1, 0], [0, 0, 1]);
  for (const sx of [-1, 1]) box(m, 0.006, yT - yB, z1 - z0, K, xX + sx * 0.108, (yB + yT) / 2, (z0 + z1) / 2);
  box(m, 0.222, 0.008, z1 - z0, K, xX, yT, (z0 + z1) / 2);
  box(m, 0.222, yT - yB, 0.006, K, xX, (yB + yT) / 2, z1);
  box(m, 0.223, 0.012, 0.005, MAT.accent, xX, yT - 0.04, z1 + 0.003);
  // Ram: a solid block on the Z carriage that slides out of the column. Spindle (80 mm) under it.
  const zs = z0 + 0.06 + 0.075;
  box(m, 0.2, 0.34, 0.15, K, xX, cc - 0.07, zs);
  cyl(m, 0.06, 0.014, K, 'y', xX, cc - 0.247, zs);
  cyl(m, 0.04, 0.11, K, 'y', xX, cc - 0.309, zs);
  cyl(m, 0.042, 0.008, MAT.accent, 'y', xX, cc - 0.262, zs);
  cyl(m, 0.022, 0.03, MAT.steel, 'y', xX, cc - 0.379, zs, 0.03);
  cyl(m, 0.004, 0.035, MAT.steel, 'y', xX, cc - 0.4115, zs);

  // A axis: rotary stage (210 mm) set into the right wall, a bearing in the left wall.
  cyl(m, 0.105, 0.012, K, 'x', 0.286, A, ZA);
  cyl(m, 0.107, 0.004, MAT.accent, 'x', 0.282, A, ZA);
  cyl(m, 0.04, 0.006, MAT.steel, 'x', 0.295, A, ZA);
  boltRing(m, 12, 0.085, 0.292, A, ZA, 1);
  cyl(m, 0.08, 0.01, K, 'x', -0.285, A, ZA);
  boltRing(m, 8, 0.06, -0.29, A, ZA, -1);
  // Cradle: 180 mm bottom with cut corners, 20 mm sides with round tops, work plate on top.
  const cr = new THREE.Group(); cr.position.set(0, A, ZA); m.add(cr);
  cr.rotation.x = Number(new URLSearchParams(location.search).get('tilt') || 0);   // A axis angle, for checking
  const l = (v) => v - 0.385;                      // machine height to cradle coordinates
  const bot = new THREE.Shape([[-0.178, l(0.27)], [-0.098, l(0.19)], [0.098, l(0.19)], [0.178, l(0.27)],
    [0.178, l(0.29)], [-0.178, l(0.29)]].map(([x, y]) => new THREE.Vector2(x, y)));
  const bm = mesh(new THREE.ExtrudeGeometry(bot, { depth: 0.21, bevelEnabled: false }), K);
  bm.position.z = -0.105; cr.add(bm);
  const side = new THREE.Shape(); side.moveTo(-0.105, l(0.29)); side.lineTo(0.105, l(0.29)); side.lineTo(0.105, 0);
  side.absarc(0, 0, 0.105, 0, Math.PI, false); side.lineTo(-0.105, l(0.29));
  for (const x of [-0.178, 0.158]) {
    const k = mesh(new THREE.ExtrudeGeometry(side, { depth: 0.02, bevelEnabled: false, curveSegments: 32 }), K);
    k.rotation.y = Math.PI / 2; k.position.x = x; cr.add(k);
  }
  for (const sx of [-1, 1]) cyl(cr, 0.06, 0.006, K, 'x', sx * 0.155, 0, 0);
  // Slanted walls from the cradle sides down to the bottom, to stiffen the cradle.
  const g = new THREE.Shape([[0.11, l(0.29)], [0.158, l(0.29)], [0.158, l(0.4)]].map(([x, y]) => new THREE.Vector2(x, y)));
  for (const sx of [-1, 1]) {
    const w = mesh(new THREE.ExtrudeGeometry(g, { depth: 0.21, bevelEnabled: false }), K);
    w.scale.x = sx; w.position.z = -0.105; cr.add(w);
  }
  // C axis: the drive sits inside the cradle bottom. The table lies on it, its bottom flush
  // with the top of the cradle. T-slots and a part.
  const tg = new THREE.Group(); tg.position.set(0, l(0.29) + 0.0101, 0); tg.rotation.y = 0.5; cr.add(tg);
  cyl(tg, 0.1, 0.02, MAT.frame, 'y', 0, 0, 0, 0.1, 64);
  for (const d of [-0.04, 0, 0.04]) box(tg, 0.19, 0.003, 0.012, MAT.dark, 0, 0.0095, d);
  box(tg, 0.08, 0.04, 0.06, MAT.steel, 0, 0.03, 0);
  return m;
}
mill.view = { cam: '2.1,2.6,4.7', target: '0,1.1,0' };

function laser() {
  // Open cutting table with slats. A gantry beam rides on two Y stages on the side walls.
  // The X stage sits on the front face of the beam (the beam is its frame).
  const m = new THREE.Group();
  const W = 0.36, H = 0.16;                       // side wall position and height
  box(m, 0.94, 0.04, 0.66, MAT.base, 0, -0.02, 0);
  for (const sx of [-1, 1]) {
    box(m, 0.21, 0.02, 0.6, MAT.frame, sx * W, H - 0.01, 0);       // top plate
    box(m, 0.02, H - 0.02, 0.6, MAT.frame, sx * (W + 0.095), (H - 0.02) / 2, 0);
    box(m, 0.02, H - 0.02, 0.6, MAT.frame, sx * (W - 0.095), (H - 0.02) / 2, 0);
    stage(m, [sx * W, H, 0], 0.03, [0, 0, 1], [0, 1, 0]);
  }
  box(m, 0.5, H - 0.02, 0.02, MAT.frame, 0, (H - 0.02) / 2, -0.29);
  box(m, 0.5, 0.05, 0.02, MAT.frame, 0, 0.025, 0.29);
  // Slats and a part-cut sheet.
  for (let i = -7; i <= 7; i++) box(m, 0.004, 0.09, 0.54, MAT.dark, i * 0.033, 0.045, 0);
  const sheet = box(m, 0.42, 0.003, 0.4, MAT.steel, 0, 0.0915, 0.02);
  // Gantry beam on the two carriages (carriage centre z = 0.03 - 0.0104).
  const BZ = 0.02, BY = H + 0.06;
  for (const sx of [-1, 1]) box(m, 0.2, 0.03, 0.2, MAT.frame, sx * W, BY + 0.015, BZ);
  box(m, 0.92, 0.12, 0.1, MAT.frame, 0, BY + 0.09, BZ);
  const x = stage(m, [0, BY + 0.09, BZ + 0.05], 0.05, [1, 0, 0], [0, 0, 1]);
  // Cutting head with a short Z slide, a knurled ring and a copper nozzle.
  const h = onCarriage(x, true);
  box(h, 0.12, 0.16, 0.03, MAT.dark, 0, -0.02, 0.015);
  box(h, 0.08, 0.06, 0.06, MAT.body, 0, 0.03, 0.06);
  cyl(h, 0.026, 0.14, MAT.steel, 'y', 0, -0.07, 0.06);
  cyl(h, 0.034, 0.03, MAT.dark, 'y', 0, -0.13, 0.06);
  cyl(h, 0.036, 0.008, MAT.accent, 'y', 0, -0.11, 0.06);
  cyl(h, 0.006, 0.03, MAT.copper, 'y', 0, -0.16, 0.06, 0.02);
  return m;
}

function lathe() {
  // Compact turning centre: headstock on the left, a slanted back wall that carries
  // two stages, and a small milling spindle that comes in at an angle.
  const m = new THREE.Group();
  const A = 0.3;                                   // spindle axis height
  const n = new THREE.Vector3(0, 0.5, 0.866);      // wall normal: towards the axis
  const u = new THREE.Vector3(0, 0.866, -0.5);     // up the wall
  const P0 = new THREE.Vector3(0.06, A, 0).addScaledVector(n, -0.29);
  box(m, 0.86, 0.06, 0.62, MAT.shell, 0, -0.03, -0.02);
  // Headstock tower with ribs behind it.
  box(m, 0.16, A + 0.11, 0.3, MAT.shell, -0.34, (A + 0.11) / 2, -0.06);
  rib(m, 0.12, 0.3, 0.02, MAT.shell, -0.3, 0, -0.21);
  // Slanted back wall with ribs, the frame behind the stages.
  const wall = box(m, 0.56, 0.03, 0.42, MAT.shell, 0, 0, 0);
  wall.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(new THREE.Vector3(1, 0, 0), n, new THREE.Vector3().crossVectors(new THREE.Vector3(1, 0, 0), n)));
  wall.position.copy(P0).addScaledVector(n, -0.015).addScaledVector(u, 0.05).setX(0.06);
  for (const rx of [-0.17, 0.06, 0.29]) rib(m, 0.2, 0.36, 0.02, MAT.shell, rx, 0, -0.29);
  // Spindle, chuck and part.
  cyl(m, 0.06, 0.03, MAT.frame, 'x', -0.245, A, 0);
  cyl(m, 0.062, 0.008, MAT.accent, 'x', -0.235, A, 0);
  cyl(m, 0.07, 0.05, MAT.dark, 'x', -0.205, A, 0);
  for (let i = 0; i < 3; i++) {
    const a = i * 2 * Math.PI / 3;
    const j = box(m, 0.02, 0.03, 0.018, MAT.steel, -0.175, A + Math.cos(a) * 0.045, Math.sin(a) * 0.045);
    j.rotation.x = -a;
  }
  cyl(m, 0.022, 0.2, MAT.steel, 'x', -0.07, A, 0);
  // Stages on the wall: Z along the spindle, cross stage up and down the wall.
  const z = stage(m, [P0.x, P0.y, P0.z], 0.02, [1, 0, 0], [n.x, n.y, n.z]);
  const c = crossStage(z, 0.0504);
  // Tool head on the cross carriage: a small milling spindle aimed at the part.
  const t = onCarriage(c, true);
  const g = new THREE.Group();
  g.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), n);
  t.add(g);
  box(g, 0.1, 0.02, 0.12, MAT.frame, 0, 0.01, 0);
  cyl(g, 0.032, 0.09, MAT.dark, 'y', 0, 0.065, 0);
  cyl(g, 0.034, 0.008, MAT.accent, 'y', 0, 0.1, 0);
  cyl(g, 0.016, 0.02, MAT.steel, 'y', 0, 0.12, 0, 0.022);
  cyl(g, 0.004, 0.03, MAT.steel, 'y', 0, 0.145, 0);
  return m;
}

function cmm() {
  // Gantry measuring machine: Y stages on raised side rails, a bridge beam,
  // the X stage on the front of the beam and a vertical Z stage with the probe.
  const m = new THREE.Group();
  const W = 0.36, RH = 0.34;                       // rail position and height
  box(m, 0.96, 0.1, 0.7, MAT.granite, 0, -0.05, 0);
  for (const sx of [-1, 1]) {
    for (const sz of [-1, 1]) box(m, 0.07, RH, 0.07, MAT.frame, sx * W, RH / 2, sz * 0.24);
    box(m, 0.21, 0.03, 0.62, MAT.frame, sx * W, RH + 0.015, 0);
    box(m, 0.02, 0.12, 0.56, MAT.frame, sx * W, RH - 0.06, 0);
    stage(m, [sx * W, RH + 0.03, 0], 0.0, [0, 0, 1], [0, 1, 0]);
  }
  const BY = RH + 0.09, BZ = -0.01;
  for (const sx of [-1, 1]) box(m, 0.2, 0.03, 0.2, MAT.frame, sx * W, BY + 0.015, BZ);
  box(m, 0.92, 0.1, 0.12, MAT.frame, 0, BY + 0.08, BZ);
  const x = stage(m, [0, BY + 0.08, BZ + 0.06], 0.06, [1, 0, 0], [0, 0, 1]);
  const h = onCarriage(x, true);
  const z = stage(h, [0, -0.1, 0], -0.06, [0, 1, 0], [0, 0, 1]);
  const p = onCarriage(z, true);
  box(p, 0.08, 0.04, 0.05, MAT.frame, 0, -0.1, 0.025);
  cyl(p, 0.02, 0.09, MAT.body, 'y', 0, -0.165, 0.03);
  cyl(p, 0.022, 0.008, MAT.accent, 'y', 0, -0.13, 0.03);
  cyl(p, 0.003, 0.05, MAT.steel, 'y', 0, -0.235, 0.03);
  const ball = mesh(new THREE.SphereGeometry(0.007, 32, 16), MAT.ruby); ball.position.set(0, -0.262, 0.03); p.add(ball);
  // A part to measure.
  box(m, 0.16, 0.05, 0.12, MAT.steel, 0.04, 0.025, 0.12);
  cyl(m, 0.025, 0.03, MAT.dark, 'y', 0.07, 0.065, 0.12);
  return m;
}

// ---------- scene ----------
const r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
r.setPixelRatio(og ? 1 : 2);
r.outputColorSpace = THREE.SRGBColorSpace;
r.toneMapping = THREE.ACESFilmicToneMapping;
r.toneMappingExposure = 0.95;
r.shadowMap.enabled = true;
r.shadowMap.type = THREE.PCFSoftShadowMap;
r.localClippingEnabled = true;
r.setClearColor(0x000000, 0);
r.setSize(el.clientWidth, el.clientHeight);
el.appendChild(r.domElement);

const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(r), 0.04).texture;
const cam = new THREE.PerspectiveCamera(24, el.clientWidth / el.clientHeight, 0.05, 20);
const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(1.2, 3.0, 1.6);
key.castShadow = true;
key.shadow.mapSize.set(4096, 4096);
Object.assign(key.shadow.camera, { left: -1.6, right: 1.6, top: 1.6, bottom: -1.6, near: 0.5, far: 8 });
key.shadow.bias = -0.0004;
key.shadow.radius = 6;
scene.add(key);
const rim = new THREE.DirectionalLight(0x00c1a0, 0.8); rim.position.set(-2.2, 0.8, -1.8); scene.add(rim);
const fill = new THREE.DirectionalLight(0x6fb8ff, 0.5); fill.position.set(-1.5, 0.6, 2.0); scene.add(fill);
scene.add(new THREE.HemisphereLight(0xffffff, 0x101010, 0.35));
const ground = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), new THREE.ShadowMaterial({ opacity: 0.45 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

const params = new URLSearchParams(location.search);
const only = params.get('only');      // render one machine, for checking: ?only=mill

parts = await loadTemplate();
const layout = [[mill, -0.62, -0.7], [cmm, 0.72, -0.7], [laser, -0.62, 0.62], [lathe, 0.72, 0.62]];
for (const [make, x, z] of layout) {
  if (only && make.name !== only) continue;
  const g = make();
  g.position.set(only ? 0 : x, g.userData.floor ? 0 : 0.1, only ? 0 : z);
  scene.add(g);
}
const view = only && layout.find(l => l[0].name === only)?.[0].view;
const camPos = (params.get('cam') || view?.cam || (only ? '1.2,0.9,1.6' : og ? '3.3,2.8,4.4' : '3.3,2.85,4.35')).split(',').map(Number);
const target = (params.get('target') || view?.target || (only ? '0,0.3,0' : '0.04,0.16,0.0')).split(',').map(Number);
cam.position.set(...camPos);
cam.lookAt(...target);
cam.updateProjectionMatrix();
scene.updateMatrixWorld(true);
for (const s of stages) s.update();
r.render(scene, cam);
setTimeout(() => { r.render(scene, cam); document.body.dataset.ready = '1'; }, 500);
</script>
