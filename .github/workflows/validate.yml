name: DOQS validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: doqs check
        run: python doqs/doqs.py check
      - name: Usage graph is current
        run: python doqs/scripts/resolve_graph.py --check
